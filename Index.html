<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopzo - Online Shopping</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
header{background:#5b21b6;color:white;padding:20px;text-align:center}
header h1{margin:0;font-size:32px}
header p{margin:8px 0 0}
.search{padding:16px;text-align:center}
input{width:90%;max-width:500px;padding:13px;border:1px solid #ddd;border-radius:8px;font-size:16px}
h2{text-align:center}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;padding:15px;max-width:1000px;margin:auto}
.card{background:white;padding:15px;border-radius:12px;text-align:center;box-shadow:0 2px 8px #ddd}
.pic{font-size:55px;padding:15px}
.price{color:#5b21b6;font-weight:bold}
button{background:#5b21b6;color:white;border:0;padding:10px 14px;border-radius:7px;cursor:pointer}
#cart{text-align:center;background:white;margin:15px;padding:18px;border-radius:10px}
footer{text-align:center;background:#222;color:white;padding:20px;margin-top:20px}
</style>
</head>
<body>
<header>
<h1>🛍️ Shopzo</h1>
<p>Your Shopping, Your Style!</p>
</header>
<div class="search">
<input id="search" placeholder="Search products..." oninput="filterProducts()">
</div>
<h2>Featured Products</h2>
<div class="products" id="products">
<div class="card"><div class="pic">👕</div><h3>T-Shirt</h3><p class="price">Rs. 999</p><button onclick="add('T-Shirt',999)">Add to Cart</button></div>
<div class="card"><div class="pic">👟</div><h3>Shoes</h3><p class="price">Rs. 2499</p><button onclick="add('Shoes',2499)">Add to Cart</button></div>
<div class="card"><div class="pic">⌚</div><h3>Watch</h3><p class="price">Rs. 1499</p><button onclick="add('Watch',1499)">Add to Cart</button></div>
<div class="card"><div class="pic">🎒</div><h3>Bag</h3><p class="price">Rs. 1299</p><button onclick="add('Bag',1299)">Add to Cart</button></div>
</div>
<div id="cart"><h2>🛒 Your Cart</h2><p id="items">No products added yet.</p><h3 id="total">Total: Rs. 0</h3></div>
<footer>© 2026 Shopzo | Online Shopping</footer>
<script>
let cart=[];
function add(name,price){
cart.push({name,price});
document.getElementById('items').textContent=cart.map(x=>x.name).join(', ');
document.getElementById('total').textContent='Total: Rs. '+cart.reduce((s,x)=>s+x.price,0);
}
function filterProducts(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.card').forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
